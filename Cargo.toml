# Virtual workspace manifest. Each server lives in its own crate under crates/.
# The `world` binary is provided by the oxcore-world crate (crates/world/src/bin/world.rs).
[workspace]
members = ["crates/auth", "crates/bnet", "crates/db", "crates/dbc", "crates/map", "crates/patcher", "crates/shared", "crates/tui", "crates/web", "crates/world", "crates/runtime"]
exclude = ["tools/extractor"]
resolver = "2"

[workspace.dependencies]
oxcore-db = { path = "crates/db" }
oxcore-shared = { path = "crates/shared" }
oxcore-dbc = { path = "crates/dbc" }
oxcore-map = { path = "crates/map" }
oxcore-tui = { path = "crates/tui" }
oxcore-world = { path = "crates/world" }
oxcore-auth = { path = "crates/auth" }
oxcore-bnet = { path = "crates/bnet" }
oxcore-web = { path = "crates/web" }

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 1
