# Virtual workspace manifest. Each server lives in its own crate under crates/.
# The `world` binary is provided by the oxcore-world crate (crates/world/src/bin/world.rs).
[workspace]
members = ["crates/auth", "crates/db", "crates/dbc", "crates/map", "crates/shared", "crates/world"]
resolver = "2"

[workspace.dependencies]
oxcore-shared = { path = "crates/shared" }
oxcore-dbc = { path = "crates/dbc" }
oxcore-map = { path = "crates/map" }
oxcore-world = { path = "crates/world" }

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 1
