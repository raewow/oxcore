[package]
name = "oxcore-bnet"
version = "0.1.0"
edition = "2021"
description = "Battle.net (BGS) login server for modern Classic clients"

[[bin]]
name = "bnet"
path = "src/main.rs"

[dependencies]
oxcore-shared.workspace = true
oxcore-tui.workspace = true

anyhow = "1.0"
axum = "0.7"
base64 = "0.22"
bytes = "1.5"
chrono = "0.4"
flate2 = "1.0"
hex = "0.4"
hyper = { version = "1.2", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "http1", "tokio", "service"] }
prost = "0.13"
rand = "0.8"
rcgen = "0.13"
rsa = { version = "0.9", features = ["sha2"] }
rustls-pemfile = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "mysql", "chrono"] }
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"

[build-dependencies]
prost-build = "0.13"

[dependencies.rustls]
version = "0.23"
default-features = false
features = ["ring", "std", "tls12"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
