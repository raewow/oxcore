// Minimal reconstruction of the Battle.net (BGS) RPC wire types needed for the login
// handshake (field numbers and types are load-bearing; the proto package name is not, so
// everything lives in one package to keep the generated Rust paths flat).
//
// proto2 because the real protocol is proto2: every field is optional on the wire, and we want
// tolerant decoding of whatever the client sends.

syntax = "proto2";

package bgs.protocol;

// A routing endpoint identity (also reused as a server/client id).
message ProcessId {
    optional uint32 label = 1;
    optional uint32 epoch = 2;
}

// The frame header that precedes every message. Only the fields we read or write are modelled;
// unknown fields on incoming headers are ignored by prost.
message Header {
    optional uint32 service_id = 1;
    optional uint32 method_id = 2;
    optional uint32 token = 3;
    optional uint64 object_id = 4;
    optional uint32 size = 5;
    optional uint32 status = 6;
    // Note: fixed32 on the wire, not varint. This is the dispatch key for requests.
    optional fixed32 service_hash = 11;
    // Connection instance id assigned by ConnectionService.Connect. The client uses this to route
    // listener callbacks such as ChallengeListener.OnExternalChallenge.
    optional string ciid = 13;
}

// Empty request/response body (e.g. KeepAlive).
message NoData {}

message BoundService {
    optional fixed32 hash = 1;
    optional uint32 id = 2;
}

message BindRequest {
    repeated fixed32 imported_service_hash = 1;
    repeated BoundService exported_service = 3;
    repeated BoundService imported_service = 4;
}

message BindResponse {
    repeated uint32 imported_service_id = 1;
}

message ConnectRequest {
    optional ProcessId client_id = 1;
    optional BindRequest bind_request = 2;
    optional bool use_bindless_rpc = 3;
}

message ConnectResponse {
    optional ProcessId server_id = 1;
    optional ProcessId client_id = 2;
    optional uint32 bind_result = 3;
    optional uint64 server_time = 6;
    optional bool use_bindless_rpc = 7;
    optional string ciid = 9;
}

message DisconnectRequest {
    optional uint32 error_code = 1;
}

message DisconnectNotification {
    optional uint32 error_code = 1;
    optional string reason = 2;
}

// A 128-bit account/game-account identity (bgs.protocol.EntityId). Both halves are fixed64 on
// the wire; the high bits encode the entity kind/region, the low bits the account id.
message EntityId {
    optional fixed64 high = 1;
    optional fixed64 low = 2;
}

// authentication.v1.LogonRequest — the client's opening call on the AuthenticationService. We
// only read program/platform/locale; the rest are modelled so tolerant decoding does not choke
// and so their field numbers are documented, but are otherwise ignored.
message LogonRequest {
    optional string program = 1;
    optional string platform = 2;
    optional string locale = 3;
    optional string email = 4;
    optional string version = 5;
    optional int32 application_version = 6;
    optional bool public_computer = 7;
    optional bool allow_logon_queue_notifications = 10;
    optional bytes cached_web_credentials = 12;
    optional string user_agent = 14;
    optional string device_id = 15;
}

// authentication.v1.VerifyWebCredentialsRequest — carries the login ticket the client obtained
// from the REST web-auth flow, as raw bytes (we treat them as the UTF-8 ticket string).
message VerifyWebCredentialsRequest {
    optional bytes web_credentials = 1;
}

// authentication.v1.LogonResult — pushed to the client via AuthenticationListener.OnLogonComplete
// once the web credentials verify. `error_code` 0 means success.
message LogonResult {
    optional uint32 error_code = 1;
    optional EntityId account_id = 2;
    repeated EntityId game_account_id = 3;
    optional string email = 4;
    repeated uint32 available_region = 5;
    optional uint32 connected_region = 6;
    optional string battle_tag = 7;
    optional string geoip_country = 8;
    optional bytes session_key = 9;
    optional bool restricted_mode = 10;
    optional string client_id = 11;
}

// challenge.v1.ChallengeExternalRequest — pushed to the client via ChallengeListener.OnExternalChallenge
// to point its embedded browser at our web-auth URL (`payload_type = "web_auth_url"`).
message ChallengeExternalRequest {
    optional string request_token = 1;
    optional string payload_type = 2;
    optional bytes payload = 3;
}

// bgs.protocol.Variant — a tagged value carried by an Attribute. We only read/write blob, string,
// int and uint values; the rest are modelled for correct decoding. Field numbers from
// attribute_types.pb.h.
message Variant {
    optional bool bool_value = 2;
    optional int64 int_value = 3;
    optional double float_value = 4;
    optional string string_value = 5;
    optional bytes blob_value = 6;
    optional bytes message_value = 7;
    optional string fourcc_value = 8;
    optional uint64 uint_value = 9;
    optional EntityId entity_id_value = 10;
}

// bgs.protocol.Attribute — a named Variant. The realm-list protocol is entirely carried as lists
// of these.
message Attribute {
    optional string name = 1;
    optional Variant value = 2;
}

// game_utilities.v1.ClientRequest / ClientResponse — GameUtilities.ProcessClientRequest ferries a
// list of attributes each way. The command and its parameters are attributes on the request; the
// results are attributes on the response.
message ClientRequest {
    repeated Attribute attribute = 1;
}

message ClientResponse {
    repeated Attribute attribute = 1;
}

// game_utilities.v1.GetAllValuesForAttributeResponse — the client asks for the legal values of an
// attribute (e.g. the list of realm sub-regions); we answer with a list of Variants.
message GetAllValuesForAttributeResponse {
    repeated Variant attribute_value = 1;
}

// ---------------------------------------------------------------------------
// account.v1 — AccountService. After OnLogonComplete the client immediately asks for its account
// and game-account state (methods 30 and 31) and disconnects if either is refused.
// ---------------------------------------------------------------------------

// Which slices of the account the client is asking for. Only the ones we answer are modelled.
message AccountFieldOptions {
    optional bool all_fields = 1;
    optional bool field_account_level_info = 2;
    optional bool field_privacy_info = 3;
    optional bool field_parental_control_info = 4;
    optional bool field_game_level_info = 6;
    optional bool field_game_status = 7;
    optional bool field_game_accounts = 8;
    optional bool field_security_status = 9;
}

message GameAccountFieldOptions {
    optional bool all_fields = 1;
    optional bool field_game_level_info = 2;
    optional bool field_game_time_info = 3;
    optional bool field_game_status = 4;
    optional bool field_raf_info = 5;
}

// Opaque version tags echoed back per field group; the client caches state against them.
message AccountFieldTags {
    optional uint32 account_level_info_tag = 2;
    optional uint32 privacy_info_tag = 3;
    optional uint32 parental_control_info_tag = 4;
    optional uint32 security_status_tag = 12;
}

message GameAccountFieldTags {
    optional uint32 game_level_info_tag = 2;
    optional uint32 game_time_info_tag = 3;
    optional uint32 game_status_tag = 4;
    optional uint32 raf_info_tag = 5;
}

message PrivacyInfo {
    optional bool is_using_rid = 3;
    optional bool is_visible_for_view_friends = 4;
    optional bool is_hidden_from_friend_finder = 5;
}

message GameLevelInfo {
    optional bool is_trial = 4;
    optional bool is_lifetime = 5;
    optional bool is_restricted = 6;
    optional bool is_beta = 7;
    optional string name = 8;
    optional uint32 program = 9;
}

message GameStatus {
    optional bool is_suspended = 4;
    optional bool is_banned = 5;
    optional uint64 suspension_expires = 6;
    optional uint32 program = 7;
}

message AccountState {
    optional PrivacyInfo privacy_info = 2;
}

message GameAccountState {
    optional GameLevelInfo game_level_info = 1;
    optional GameStatus game_status = 3;
}

message GetAccountStateRequest {
    optional EntityId entity_id = 1;
    optional uint32 program = 2;
    optional uint32 region = 3;
    optional AccountFieldOptions options = 10;
    optional AccountFieldTags tags = 11;
}

message GetAccountStateResponse {
    optional AccountState state = 1;
    optional AccountFieldTags tags = 2;
}

// The id fields are decoded but unused: this server has exactly one game account per bnet account,
// so the session already knows which one is meant. (Worth noting: other proto numberings for this
// message put the game account in field 2, but the 1.14.2 client sends it in field 1 --
// ignoring both fields sidesteps the disagreement.)
message GetGameAccountStateRequest {
    optional EntityId account_id = 1;
    optional EntityId game_account_id = 2;
    optional GameAccountFieldOptions options = 10;
    optional GameAccountFieldTags tags = 11;
}

message GetGameAccountStateResponse {
    optional GameAccountState state = 1;
    optional GameAccountFieldTags tags = 2;
}
