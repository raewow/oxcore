[package]
name = "rcore-db"
version = "0.1.0"
edition = "2021"
authors = ["MaNGOS Rust Port"]
description = "Database migration tool for rcore"

[[bin]]
name = "db"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "mysql", "chrono"] }
tokio = { version = "1.35", features = ["rt-multi-thread", "macros"] }
toml = "0.8"
