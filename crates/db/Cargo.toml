[package]
name = "oxcore-db"
version = "0.1.0"
edition = "2021"
authors = ["MaNGOS Rust Port"]
description = "Database persistence library and migration tool for oxcore"

[features]
default = []
testing = ["dep:mockall"]

[[bin]]
name = "db"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1.89"
bitflags = "2.4"
chrono = "0.4"
clap = { version = "4.4", features = ["derive"] }
hex = "0.4"
mockall = { version = "0.13", optional = true }
oxcore-shared.workspace = true
serde = { version = "1.0", features = ["derive"] }
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "mysql", "postgres", "chrono"] }
tokio = { version = "1.35", features = ["rt-multi-thread", "macros"] }
toml = "0.8"
tracing = "0.1"
wow_srp = "0.7"
