[package]
name = "oxcore-runtime"
version = "0.1.0"
edition = "2021"
description = "Unified oxcore runtime: runs auth and world servers in one process with a shared TUI"

[[bin]]
name = "oxcore"
path = "src/main.rs"

[dependencies]
oxcore-shared.workspace = true
oxcore-tui.workspace = true
oxcore-auth.workspace = true
oxcore-world.workspace = true

anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
tracing = "0.1"

[lints.rust]
unused = "allow"
