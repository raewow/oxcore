[package]
name = "oxcore-web"
version = "0.1.0"
edition = "2021"
description = "Player portal and operations console for oxcore"

[[bin]]
name = "web"
path = "src/bin/web.rs"
required-features = ["ssr"]

[[bin]]
name = "oxcore-web"
path = "src/main.rs"
required-features = ["ssr"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["ssr"]
hydrate = ["dep:console_error_panic_hook", "dep:wasm-bindgen", "leptos/hydrate"]
ssr = [
    "dep:anyhow",
    "dep:axum",
    "dep:axum-extra",
    "dep:base64",
    "dep:hex",
    "dep:leptos_axum",
    "dep:oxcore-shared",
    "dep:rand",
    "dep:sha2",
    "dep:sqlx",
    "dep:tokio",
    "dep:tower-http",
    "dep:tracing",
    "dep:tracing-appender",
    "dep:tracing-subscriber",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]

[dependencies]
anyhow = { version = "1.0", optional = true }
axum = { version = "0.8", optional = true }
axum-extra = { version = "0.10", features = ["cookie"], optional = true }
base64 = { version = "0.22", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
hex = { version = "0.4", optional = true }
leptos = { version = "0.8", default-features = false }
leptos_axum = { version = "0.8", optional = true }
leptos_meta = { version = "0.8", default-features = false }
leptos_router = { version = "0.8", default-features = false }
oxcore-shared = { workspace = true, optional = true }
rand = { version = "0.8", optional = true }
serde = { version = "1.0", features = ["derive"] }
sha2 = { version = "0.10", optional = true }
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "mysql"], optional = true }
tokio = { version = "1.35", features = ["macros", "net", "rt-multi-thread", "signal"], optional = true }
tower-http = { version = "0.6", features = ["trace"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-appender = { version = "0.2", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[package.metadata.leptos]
bin-target = "oxcore-web"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
output-name = "web"
site-root = "target/site"
site-pkg-dir = "pkg"
tailwind-input-file = "style/tailwind.css"
assets-dir = "public"
site-addr = "127.0.0.1:8080"
reload-port = 3001
browserquery = "defaults"
graceful-shutdown-unix-signal = "SIGTERM"
