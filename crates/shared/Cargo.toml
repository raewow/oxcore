[package]
name = "oxcore-shared"
version = "0.1.0"
edition = "2021"
authors = ["MaNGOS Rust Port"]
description = "Shared protocol and utility code for oxcore"

[dependencies]
anyhow = "1.0"
bitflags = "2.4"
byteorder = "1.5"
bytes = "1.5"
chrono = "0.4"
flate2 = "1.0"
hex = "0.4"
hmac = "0.12"
num-bigint = { version = "0.4", features = ["rand"] }
num-traits = "0.2"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "sync"] }
toml = "0.8"
tracing = "0.1"
wow_srp = "0.7"
