[package]
name = "oxcore-map"
version = "0.1.0"
edition = "2021"
authors = ["MaNGOS Rust Port"]
description = "Spatial maps, grids, and pathfinding (navmesh/vmap/mmap) for oxcore"

[dependencies]
oxcore-shared.workspace = true

anyhow = "1.0"
byteorder = "1.5"
dashmap = "5.5"
num-traits = "0.2"
parking_lot = "0.12"
pathfinding = "4.6"
smallvec = "1.11"
tracing = "0.1"

[lints.rust]
unused = "allow"
